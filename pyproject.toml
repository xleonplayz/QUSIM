[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qusim"
version = "0.1.0"
description = "Hyperrealistic NV Center Quantum Simulator"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Leon Kaiser", email = "l.kaiser@em.uni-frankfurt.de"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["quantum", "simulation", "NV center", "diamond", "physics"]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2023.9.10",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/xleonplayz/QUSIM"
Documentation = "https://xleonplayz.github.io/QUSIM/"
Repository = "https://github.com/xleonplayz/QUSIM.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
