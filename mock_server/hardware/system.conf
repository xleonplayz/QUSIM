# NV Center Simulator System Configuration
# Diese Parameter sind nicht über die API verfügbar und werden hier konfiguriert

[nv_system]
# NV Center physics parameters
lambda_par = 5.3e9      # Hz - parallel hyperfine coupling
lambda_perp = 0.3e9     # Hz - perpendicular hyperfine coupling
Delta_ss = 1.4e9        # Hz - singlet-singlet splitting
Pi_x = 50e6             # Hz - nuclear quadrupole x
Pi_y = 0.0              # Hz - nuclear quadrupole y

# Optical parameters
k_eslac_max = 1.5e6     # Hz - max ESLAC rate

# Relaxation parameters
T1_g0 = 2e-3           # s - T1 for ground state ms=0
a_Raman = 2e-3         # Raman scattering parameter
b_Orbach = 5e7         # Orbach process parameter
Delta_Orbach_eV = 0.07 # eV - Orbach activation energy
d_B2 = 2e3             # magnetic decoherence parameter

[photoluminescence]
# PL parameters
prompt_amp = 0.2e8      # counts/s - prompt fluorescence amplitude
prompt_tau = 40e-9      # s - prompt fluorescence lifetime
measured_at_detector = true
laser_tau = 20e-9       # s - laser pulse decay time

[detector]
# Detector parameters
model = "nonparalyzable"
dead_time = 60e-9       # s
afterpulse_p = 0.01     # afterpulse probability
afterpulse_mode = "mixture"
afterpulse_tau1 = 40e-9  # s
afterpulse_tau2 = 200e-9 # s
afterpulse_w1 = 0.7     # weight for tau1
afterpulse_generations = 2
overdispersion_k = 300.0 # overdispersion parameter

[noise]
# Noise parameters
rin_enable = true
rin_tau = 10e-9         # s - RIN correlation time
rin_sigma = 0.12        # RIN amplitude

[simulation]
# Simulation parameters
oversample_per_ns = 30  # oversampling factor
positivity_clamp = true # enforce positive eigenvalues
clamp_epsilon = 1e-15   # minimum eigenvalue
seed = 42               # random seed

[awg]
# AWG hardware specifications
max_sample_rate = 50e9  # Hz - maximum sample rate
dac_bits = 10          # DAC resolution
rf_max_carrier = 20e9   # Hz - max RF carrier frequency
channels = 2           # number of channels